[workspace]
resolver = "3"
members = ["crates/domain-text", "crates/contracts-ids", "crates/contracts-http", "crates/platform-time", "crates/platform-config", "crates/platform-http", "crates/platform-startup", "crates/platform-db", "crates/platform-obs", "crates/svc-identity", "crates/svc-gateway", "crates/svc-catalog", "crates/svc-reader", "crates/svc-ingestion", "crates/svc-notify", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_enum_match_arm = "deny"
