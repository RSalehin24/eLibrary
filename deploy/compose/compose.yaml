# Skeleton: postgres plus one sample container per service (and a migrate one-shot for each
# service with a database). Caddy and web join when they exist.
name: elibrary

x-service-base: &service-base
  networks: [internal]
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - identity_db_password
      - catalog_db_password
      - reader_db_password
      - ingestion_db_password
      - notify_db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    <<: *service-base
    build:
      context: ../..
      dockerfile: deploy/docker/service.Dockerfile
      args: {SERVICE: gateway}
    environment:
      ELIBRARY_LISTEN_ADDRESS: 0.0.0.0:8080
      ELIBRARY_INTERNAL_ADDRESS: 0.0.0.0:9090

  identity-migrate:
    <<: *service-base
    build:
      context: ../..
      dockerfile: deploy/docker/service.Dockerfile
      args: {SERVICE: identity}
    environment:
      ELIBRARY_LISTEN_ADDRESS: 0.0.0.0:8080
      ELIBRARY_INTERNAL_ADDRESS: 0.0.0.0:9090
      ELIBRARY_DATABASE_HOST: postgres
      ELIBRARY_DATABASE_PORT: "5432"
      ELIBRARY_DATABASE_NAME: identity
      ELIBRARY_DATABASE_USER: identity
      ELIBRARY_DATABASE_PASSWORD_FILE: /run/secrets/identity_db_password
    secrets:
      - identity_db_password
    command: ["migrate"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  identity:
    <<: *service-base
    build:
      context: ../..
      dockerfile: deploy/docker/service.Dockerfile
      args: {SERVICE: identity}
    environment:
      ELIBRARY_LISTEN_ADDRESS: 0.0.0.0:8080
      ELIBRARY_INTERNAL_ADDRESS: 0.0.0.0:9090
      ELIBRARY_DATABASE_HOST: postgres
      ELIBRARY_DATABASE_PORT: "5432"
      ELIBRARY_DATABASE_NAME: identity
      ELIBRARY_DATABASE_USER: identity
      ELIBRARY_DATABASE_PASSWORD_FILE: /run/secrets/identity_db_password
    secrets:
      - identity_db_password
    depends_on:
      identity-migrate:
        condition: service_completed_successfully

  catalog-migrate:
    <<: *service-base
    build:
      context: ../..
      dockerfile: deploy/docker/service.Dockerfile
      args: {SERVICE: catalog}
    environment:
      ELIBRARY_LISTEN_ADDRESS: 0.0.0.0:8080
      ELIBRARY_INTERNAL_ADDRESS: 0.0.0.0:9090
      ELIBRARY_DATABASE_HOST: postgres
      ELIBRARY_DATABASE_PORT: "5432"
      ELIBRARY_DATABASE_NAME: catalog
      ELIBRARY_DATABASE_USER: catalog
      ELIBRARY_DATABASE_PASSWORD_FILE: /run/secrets/catalog_db_password
    secrets:
      - catalog_db_password
    command: ["migrate"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  catalog:
    <<: *service-base
    build:
      context: ../..
      dockerfile: deploy/docker/service.Dockerfile
      args: {SERVICE: catalog}
    environment:
      ELIBRARY_LISTEN_ADDRESS: 0.0.0.0:8080
      ELIBRARY_INTERNAL_ADDRESS: 0.0.0.0:9090
      ELIBRARY_DATABASE_HOST: postgres
      ELIBRARY_DATABASE_PORT: "5432"
      ELIBRARY_DATABASE_NAME: catalog
      ELIBRARY_DATABASE_USER: catalog
      ELIBRARY_DATABASE_PASSWORD_FILE: /run/secrets/catalog_db_password
    secrets:
      - catalog_db_password
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully

  reader-migrate:
