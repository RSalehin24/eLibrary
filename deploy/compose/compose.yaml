      ELIBRARY_INTERNAL_ADDRESS: 0.0.0.0:9090
      ELIBRARY_DATABASE_HOST: postgres
      ELIBRARY_DATABASE_PORT: "5432"
      ELIBRARY_DATABASE_NAME: reader
      ELIBRARY_DATABASE_USER: reader
      ELIBRARY_DATABASE_PASSWORD_FILE: /run/secrets/reader_db_password
    secrets:
      - reader_db_password
    command: ["migrate"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  reader:
