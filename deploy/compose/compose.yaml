# Skeleton: postgres and one sample service. The other containers join as their services appear.
name: elibrary

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5

  identity:
    build:
      context: ../..
      dockerfile: deploy/docker/svc-identity.Dockerfile
    environment:
      ELIBRARY_LISTEN_ADDRESS: 0.0.0.0:8080
      ELIBRARY_INTERNAL_ADDRESS: 0.0.0.0:9090
    networks: [internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  internal:
    internal: true

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ../secrets/postgres_password
