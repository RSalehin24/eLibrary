networks:
  internal:
    internal: true
  edge: {}

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

secrets:
  postgres_password:
    file: ../secrets/postgres_password
  identity_db_password:
    file: ../secrets/identity_db_password
  catalog_db_password:
    file: ../secrets/catalog_db_password
  reader_db_password:
    file: ../secrets/reader_db_password
  ingestion_db_password:
    file: ../secrets/ingestion_db_password
  notify_db_password:
