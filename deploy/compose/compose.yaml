# Skeleton: postgres and one sample service. The other containers join as their services appear.
name: elibrary

x-identity-base: &identity-base
  build:
    context: ../..
    dockerfile: deploy/docker/svc-identity.Dockerfile
  environment:
    ELIBRARY_LISTEN_ADDRESS: 0.0.0.0:8080
    ELIBRARY_INTERNAL_ADDRESS: 0.0.0.0:9090
    ELIBRARY_DATABASE_HOST: postgres
    ELIBRARY_DATABASE_PORT: "5432"
    ELIBRARY_DATABASE_NAME: identity
    ELIBRARY_DATABASE_USER: identity
    ELIBRARY_DATABASE_PASSWORD_FILE: /run/secrets/identity_db_password
  secrets:
    - identity_db_password
  networks: [internal]
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - identity_db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5

  identity-migrate:
    <<: *identity-base
    command: ["migrate"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  identity:
    <<: *identity-base
    depends_on:
      identity-migrate:
        condition: service_completed_successfully

networks:
  internal:
    internal: true

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ../secrets/postgres_password
  identity_db_password:
    file: ../secrets/identity_db_password
