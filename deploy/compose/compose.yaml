      ELIBRARY_DATABASE_PORT: "5432"
      ELIBRARY_DATABASE_NAME: notify
      ELIBRARY_DATABASE_USER: notify
      ELIBRARY_DATABASE_PASSWORD_FILE: /run/secrets/notify_db_password
    secrets:
