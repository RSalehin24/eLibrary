# Throwaway Postgres for database tests (gate Q4): published on localhost only, no password,
# no data kept. Run by `cargo xtask check`; never part of the real stack.
name: elibrary-test

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
