client_max_body_size 32m;
client_body_timeout 30s;
send_timeout 60s;

location ^~ /_protected/ {
    internal;
    alias $protected_storage/;
    disable_symlinks on;
    add_header Cache-Control "private, no-store" always;
    # Internal redirects drop unrecognized upstream headers; retain the reader sandbox.
    add_header Content-Security-Policy $upstream_http_content_security_policy always;
    add_header X-Frame-Options $upstream_http_x_frame_options always;
    add_header X-Robots-Tag noindex always;
    include /etc/nginx/response-security.conf;
}

location ^~ /media/ { return 404; }

location ^~ /api/v1/ {
    proxy_pass http://library_api;
    include /etc/nginx/proxy-headers.conf;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_cache off;
}

location ^~ /api/ { return 404; }

location ^~ /admin/ {
    proxy_pass http://library_api;
    include /etc/nginx/proxy-headers.conf;
    proxy_cache off;
}

location ^~ /static/ {
    alias $maintenance_static/;
    include /etc/nginx/response-security.conf;
}

location ^~ /_next/static/ {
    alias $frontend_static/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/response-security.conf;
}

location / {
    proxy_pass http://library_frontend;
    include /etc/nginx/proxy-headers.conf;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_cache off;
}
