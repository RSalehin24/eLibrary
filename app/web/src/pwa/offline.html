<body><main><p>বাংলা পাঠাগার</p><h1>ইন্টারনেট সংযোগ প্রয়োজন</h1><p>সংযোগ পাওয়া যাচ্ছে না। বই পড়া, নোট সংরক্ষণ ও অ্যাকাউন্টের কাজের জন্য এই সংস্করণে ইন্টারনেট প্রয়োজন।</p><p>সংযোগ ফিরে এলে পাতাটি আবার খুলুন।</p><a href="">আবার চেষ্টা করুন</a></main></body></html>
