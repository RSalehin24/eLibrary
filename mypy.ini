[mypy.plugins.django-stubs]
django_settings_module = config.settings

[mypy-django_otp.*]
follow_untyped_imports = True

[mypy-kombu.*]
follow_untyped_imports = True

[mypy-celery.*]
follow_untyped_imports = True

[mypy-requests.*]
follow_untyped_imports = True

[mypy-ebooklib.*]
follow_untyped_imports = True
