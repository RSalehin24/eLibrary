[package]
name = "platform-internal-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts-http = { path = "../contracts-http" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
platform-service-token = { path = "../platform-service-token" }
platform-time = { path = "../platform-time" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
