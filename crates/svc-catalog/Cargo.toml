[package]
name = "svc-catalog"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
contracts-http = { path = "../contracts-http" }
platform-config = { path = "../platform-config" }
platform-http = { version = "0.1.0", path = "../platform-http" }
platform-obs = { version = "0.1.0", path = "../platform-obs" }
platform-startup = { version = "0.1.0", path = "../platform-startup" }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
uuid = { version = "1.29.3", features = ["serde", "v7"] }

[dev-dependencies]
platform-testkit = { path = "../platform-testkit" }
tower = { version = "0.5.3", features = ["util"] }
