[package]
name = "svc-identity"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
platform-http = { path = "../platform-http" }
platform-obs = { path = "../platform-obs" }
platform-startup = { path = "../platform-startup" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }

[dev-dependencies]
platform-testkit = { path = "../platform-testkit" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
