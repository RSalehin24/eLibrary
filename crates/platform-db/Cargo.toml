[package]
name = "platform-db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
platform-config = { path = "../platform-config" }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "migrate"] }
thiserror = "2.0.21"

[dev-dependencies]
platform-testkit = { path = "../platform-testkit" }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
