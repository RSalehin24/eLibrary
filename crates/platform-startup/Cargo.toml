[package]
name = "platform-startup"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
platform-config = { path = "../platform-config" }
platform-db = { path = "../platform-db" }
platform-http = { path = "../platform-http" }
platform-obs = { path = "../platform-obs" }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "net", "signal", "sync"] }
tracing = "0.1.44"
