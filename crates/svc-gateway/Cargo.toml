[package]
name = "svc-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
contracts-http = { path = "../contracts-http" }
platform-config = { path = "../platform-config" }
platform-internal-http = { path = "../platform-internal-http" }
platform-random = { path = "../platform-random" }
platform-service-token = { path = "../platform-service-token" }
platform-time = { path = "../platform-time" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
platform-http = { version = "0.1.0", path = "../platform-http" }
platform-obs = { version = "0.1.0", path = "../platform-obs" }
platform-startup = { version = "0.1.0", path = "../platform-startup" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
proptest = "1.12.0"
tower = { version = "0.5.3", features = ["util"] }
